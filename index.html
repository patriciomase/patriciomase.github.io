<!doctype html>
<!--
  This file exists only for GitHub Pages.

  The site itself is the Next.js app in src/ and is served from Vercel. GitHub
  refuses to deactivate Pages for a <user>.github.io repository, so this URL
  will always serve whatever sits at the root of the default branch. Without
  this file that would be a 404, so it redirects to the real site instead.

  Next.js ignores this file: it builds from src/app and serves static assets
  from public/. Nothing here reaches the deployed site.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patricio Gabriel Maseda</title>
  <link rel="canonical" href="https://patriciomase-web.vercel.app/">
  <meta http-equiv="refresh" content="0; url=https://patriciomase-web.vercel.app/">
  <meta name="robots" content="noindex">
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #f7f8fb;
      color: #182032;
      font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    a { color: #176b87; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p>This site has moved.</p>
    <p><a href="https://patriciomase-web.vercel.app/">patriciomase-web.vercel.app</a></p>
  </main>
  <script>
    window.location.replace("https://patriciomase-web.vercel.app/");
  </script>
</body>
</html>
